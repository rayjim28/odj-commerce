name: Remove merged feature branches

on:
  push:
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Remove unchanged branches from merged pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targets = [
              'customer-verification-preview',
              'dynamic-launch-verification-20261111',
              'launch-tax-refund-readiness',
              'owner-admin-public-sales-control-20261111',
              'owner-checklist-clarity-20261111',
              'public-checkout-production-hardening-20261111',
              'public-storefront-preview',
              'refund-order-fulfillment-label-20261111',
              'refund-webhook-ordering-20261111',
              'release-audit-and-docs-20261111',
              'stripe-historical-refund-reconciliation-20261111',
              'stripe-restricted-key-support',
              'prune-merged-branches-20261111'
            ];
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100
            });
            let removed = 0;
            for (const branch of targets) {
              // Delete only an unchanged branch that belongs to a merged PR.
              const pr = prs.find(p => p.head.ref === branch &&
                p.head.repo?.full_name === context.repo.owner + '/' + repo &&
                p.merged_at);
              if (!pr) {
                core.info('Skipped branch without a merged PR: ' + branch);
                continue;
              }
              let current;
              try {
                current = await github.rest.git.getRef({
                  owner, repo, ref: 'heads/' + branch
                });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (current.data.object.sha !== pr.head.sha) {
                core.warning('Skipped modified branch: ' + branch);
                continue;
              }
              if (branch === context.payload.repository.default_branch) continue;
              await github.rest.git.deleteRef({
                owner, repo, ref: 'heads/' + branch
              });
              removed++;
              core.info('Deleted merged branch: ' + branch);
            }
            core.info('Deleted ' + removed + ' merged branches.');
