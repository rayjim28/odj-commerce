name: ODJ quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # Each legacy test module creates its own disposable SQLite database at import.
      - run: python -m pytest -q tests/test_app.py
      - run: python -m pytest -q tests/test_v74.py
      - run: python -m pytest -q tests/test_v75.py
      - run: python -m compileall -q main.py database.py security.py staging_security.py scripts
      - run: python -m pytest -q tests/test_v76.py
      - run: python -m pytest -q tests/test_public_preview.py
      - run: python -m pytest -q tests/test_stripe_restricted_keys.py
      - run: python -m pytest -q tests/test_account_preview.py
      - run: python -m pytest -q tests/test_launch_tax_refunds.py
      - run: python -m pytest -q tests/test_public_checkout_handoff.py
      - run: python -m pytest -q tests/test_owner_sales_control.py
      - run: python -m pytest -q tests/test_legacy_refund_reconciliation.py
      - run: python -m pytest -q tests/test_launch_checklist_evidence.py
